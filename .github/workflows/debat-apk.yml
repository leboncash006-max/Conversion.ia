name: Build APK (debat)

on:
  push:
    paths:
      - "debat/**"
      - ".github/workflows/debat-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: flutter create --platforms=android --org com.debat --project-name debat .
      - name: Supprimer le test d'exemple généré
        run: rm -rf test
      - name: Autoriser Internet en release
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Débat"|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: debat-${{ github.run_number }}
          name: Débat build ${{ github.run_number }}
          files: debat/build/app/outputs/flutter-apk/app-release.apk
