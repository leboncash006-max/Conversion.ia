name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Creer le projet
        run: |
          flutter create allo18 --platforms=android --org fr.allo18
          rm -rf allo18/lib allo18/test
          cp -r lib test allo18/
          cp -r android_res/. allo18/android/app/src/main/res/
          cd allo18
          flutter pub add path_provider
          sed -i 's/android:label="allo18"/android:label="Allô 18"/' android/app/src/main/AndroidManifest.xml
      - name: Tester
        run: |
          cd allo18
          flutter analyze
          flutter test
      - name: Compiler
        run: |
          cd allo18
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk ../Allo18.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Allô 18 · build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Allo18.apk
